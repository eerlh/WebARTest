name: Deploy Unity WebGL to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare Unity WebGL site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet brotli

          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'Build/*.br' \
            ./ _site/

          python3 - <<'PY'
          from pathlib import Path
          import brotli

          for name in (
              "weboutput.data",
              "weboutput.framework.js",
              "weboutput.wasm",
          ):
              source = Path("Build") / f"{name}.br"
              destination = Path("_site/Build") / name
              destination.write_bytes(brotli.decompress(source.read_bytes()))
          PY

          sed -i \
            -e 's|Build/weboutput.data.br|Build/weboutput.data|g' \
            -e 's|Build/weboutput.framework.js.br|Build/weboutput.framework.js|g' \
            -e 's|Build/weboutput.wasm.br|Build/weboutput.wasm|g' \
            _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Unity WebGL to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare Unity WebGL site
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes brotli

          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'Build/*.br' \
            ./ _site/

          brotli --decompress Build/weboutput.data.br \
            --output _site/Build/weboutput.data
          brotli --decompress Build/weboutput.framework.js.br \
            --output _site/Build/weboutput.framework.js
          brotli --decompress Build/weboutput.wasm.br \
            --output _site/Build/weboutput.wasm

          sed -i \
            -e 's|Build/weboutput.data.br|Build/weboutput.data|g' \
            -e 's|Build/weboutput.framework.js.br|Build/weboutput.framework.js|g' \
            -e 's|Build/weboutput.wasm.br|Build/weboutput.wasm|g' \
            _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
